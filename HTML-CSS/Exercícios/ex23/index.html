<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        table{
            width: 400px;
            height:400px ;
            border-collapse: collapse;

          
        }
        td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
            vertical-align: middle;
        }

        .numero{
            text-align: right;
        }

        td.linha{
            background-color: lightgray;
        }
        td.marcatexto{
            background-color: yellow;
        }
        tr.marcatexto{
            background-color: rgb(0, 255, 21);
        }
    </style>
</head>
<body>
    <h1>tabela</h1>
    <table>
         <tr>
            <td>a1</td>
            <td>b1</td>
            <td>c1</td>
         </tr>
         <tr>
            <td>a2</td>
            <td>b2</td>
            <td class="numero">c2</td>
         </tr>
            <tr>
                <td>a3</td>
                <td>b3</td>
                <td class="numero">c3</td>
            </tr>
    </table>
</body>
</html>
